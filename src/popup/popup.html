<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"><title>BRX Player</title></head><body><main><h1>BiliRoaming-X Player</h1><label><input id="enabled" type="checkbox"> 启用</label><label>服务端 <input id="serverBaseUrl"></label><label>区域 <select id="area"><option value="hk">HK</option><option value="tw">TW</option><option value="cn">CN</option><option value="th">TH</option></select></label><label>Access Key <textarea id="accessKey" rows="3" placeholder="App access_key"></textarea></label><button id="readKey">从当前 B 站页面读取 access_key</button><label>默认清晰度 <select id="defaultQn"><option value="112">1080P+</option><option value="80">1080P</option><option value="64">720P</option><option value="32">480P</option><option value="16">360P</option></select></label><label>默认编码 <select id="defaultCodec"><option value="auto">自动</option><option value="avc">AVC</option><option value="hevc">HEVC</option><option value="av1">AV1</option></select></label><label><input id="danmakuEnabled" type="checkbox"> 弹幕</label><button id="save">保存</button><p id="status"></p></main><script type="module" src="popup.js"></script></body></html>
